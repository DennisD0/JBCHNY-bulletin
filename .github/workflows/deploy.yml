name: Deploy to VM

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/**"
      - "**/*.md"
  workflow_dispatch:

# The e2-micro VM can only run one `next build` at a time; queue deploys.
concurrency:
  group: deploy-vm
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 34.61.20.62
          username: dennisnasa
          key: ${{ secrets.VM_DEPLOY_KEY }}
          command_timeout: 20m
          script: |
            cd ~/bulletin
            # Bulletins and plans saved on the live site sit in tracked data/*.json files,
            # so set them aside before the reset and put them back after it.
            if [ -f scripts/keep-data.sh ]; then
              bash scripts/keep-data.sh save
            else
              rm -rf ~/bulletin-data-live && mkdir -p ~/bulletin-data-live
              cp -a data/*.json ~/bulletin-data-live/
              git rev-parse HEAD > ~/bulletin-data-live/.head
            fi
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            bash scripts/keep-data.sh restore
            bash ~/bulletin/scripts/deploy.sh
